<!DOCTYPE html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioViewer 3D</title>
    <meta name="google" content="notranslate" />
  </head>
  <body>
    <div id="ui-overlay">
      <h1>BioViewer 3D</h1>
      <label><span data-i18n="lang"></span>
        <select id="lang-select">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <p id="status"></p>
      <div class="row">
        <input id="id-input" data-i18n-ph="ph" />
        <button id="load-btn" data-i18n="load"></button>
      </div>
      <label><span data-i18n="file"></span> <input id="pdb-file-input" type="file" accept=".pdb,.ent" /></label>
      <label><span data-i18n="color"></span>
        <select id="color-mode">
          <option value="confidence" id="conf-option"></option>
          <option value="element" data-i18n="element"></option>
          <option value="residue" data-i18n="residue"></option>
          <option value="chain" data-i18n="chain"></option>
          <option value="ss" data-i18n="ss"></option>
          <option value="ss" data-i18n="ss"></option>
        </select>
      </label>
      <label><input id="show-ribbon" type="checkbox" checked /> <span data-i18n="ribbon"></span></label>
      <label><input id="show-atoms" type="checkbox" /> <span data-i18n="atoms"></span></label>
    <label><input id="show-atoms" type="checkbox" /> <span data-i18n="atoms"></span></label>
      <div class="stats">
        <span data-i18n="nAtoms"></span>: <b id="stat-atoms">-</b> ·
        <span data-i18n="nChains"></span>: <b id="stat-chains">-</b> · FPS: <b id="stat-fps">-</b>
      </div>
      <div id="info-card"></div>
      <footer id="credits">
        <span data-i18n="data"></span>
        <a href="https://alphafold.ebi.ac.uk" target="_blank" rel="noopener">AlphaFold DB</a>
        (CC BY 4.0; Jumper et al., Nature 2021; Fleming et al., J Mol Biol 2025),
        <a href="https://www.uniprot.org" target="_blank" rel="noopener">UniProt</a>,
        <a href="https://www.rcsb.org" target="_blank" rel="noopener">RCSB PDB</a>.
      </footer>
    </div>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
